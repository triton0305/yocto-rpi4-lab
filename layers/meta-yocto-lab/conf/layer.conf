# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-yocto-lab"
BBFILE_PATTERN_meta-yocto-lab = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-yocto-lab = "6"

LAYERDEPENDS_meta-yocto-lab = "core"
LAYERSERIES_COMPAT_meta-yocto-lab = "wrynose"
